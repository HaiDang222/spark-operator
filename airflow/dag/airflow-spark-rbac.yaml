apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-application-role
  namespace: spark-jobs
rules:
  # SparkApplication CRD permissions
  - apiGroups: ["sparkoperator.k8s.io"]
    resources:
      - "sparkapplications"
      - "sparkapplications/status"
      - "sparkapplications/finalizers"
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  # Pod permissions for driver/executor
  - apiGroups: [""]
    resources:
      - "pods"
      - "pods/log"
    verbs:
      - get
      - list
      - watch
      - create
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-application-rolebinding
  namespace: spark-jobs
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: airflow   # MUST match the namespace of the Airflow pod
roleRef:
  kind: Role
  name: spark-application-role
  apiGroup: rbac.authorization.k8s.io