airflowVersion: "3.1.7"

# Images
images:
  airflow:
    repository: apache/airflow
    tag: 3.1.7
executor: "KubernetesExecutor"

ingress:
  enabled: true

workers:
  persistence:
    enabled: false

# Airflow scheduler settings
scheduler:
  enabled: true
  replicas: 1

  resources:
    limits:
      cpu: 400m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Airflow webserver settings
webserver:
  enabled: true
  service:
    type: ClusterIP
    ## service annotations
    annotations: {}
    ports:
      - name: airflow-ui
        port: 8080
  resources:
    limits:
      cpu: 600m
      memory: 2048Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Airflow Triggerer Config
triggerer:
  enabled: true
  replicas: 1
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 400m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 128Mi

statsd:
  enabled: true
  resources:
    limits:
      cpu: 400m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 128Mi
# Configuration for the redis provisioned by the chart
redis:
  enabled: false

postgresql:
  enabled: true
  persistence:
    size: 20Gi
  image:
    repository: bitnamilegacy/postgresql
    tag: "16.1.0-debian-11-r15"
  auth:
    enablePostgresUser: true
    username: "admin"
    existingSecret: airflow-postgresql-credentials
#    superuser: true

data:
  metadataConnection:
    user: postgres
    pass: admin
    protocol: postgresql
    host: airflow-postgresql.airflow
    port: 5432
    db: postgres
    sslmode: disable

# Git sync
dags:
  mountPath: ~
  persistence:
    annotations: {}
    enabled: false
#    size: 1Gi
#    storageClassName:
#    accessMode: ReadWriteOnce
#    existingClaim: pvc-blob-nas-storage
#    subPath: ~
  gitSync:
    enabled: true
    repo: git@github.com:HaiDang222/spark-operator.git
    branch: main
    rev: HEAD
    # The git revision (branch, tag, or hash) to check out, v4 only
    ref: v2-2-stable
    depth: 1
    # the number of consecutive failures allowed before aborting
    maxFailures: 0
    # subpath within the repo where dags are located
    # should be "" if dags are at repo root
    subPath: "airflow/dag"
    sshKeySecret: airflow-git-ssh-key-secret

logs:
  persistence:
    # Enable persistent volume for storing logs
    enabled: true
    # Volume size for logs
    size: 100Gi
    # Annotations for the logs PVC
    annotations: {}
    # If using a custom storageClass, pass name here
    storageClassName: standard
    ## the name of an existing PVC to use
#    existingClaim: logs-airflow-triggerer-0
    ## the subpath of the existing PVC to use
#    subPath: airflow-logs

airflow:
  config:
    # Disable remote logging (write logs locally)
    AIRFLOW__LOGGING__REMOTE_LOGGING: "False"

    # Base folder for task logs (mount this path to your PVC)
    AIRFLOW__CORE__BASE_LOG_FOLDER: airflow-logs